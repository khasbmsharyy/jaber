<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المقرر الكامل | الجبر الخطي</title>
<style>
:root{--bg:#08111f;--card:#101d30;--card2:#172942;--line:#3b587e;--a:#7767f5;--good:#22c55e;--muted:#b0c3da;--text:#eef5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#08111f,#182b4e);color:var(--text);font-family:Tahoma,Arial;line-height:1.9}.wrap{max-width:1100px;margin:auto;padding:24px 16px 50px}.hero{text-align:center}.hero h1{color:#d8ceff;margin:0;font-size:clamp(27px,5vw,44px)}.hero p{color:var(--muted)}.actions{text-align:center;margin:18px}.btn{display:inline-block;color:#fff;background:var(--a);padding:8px 14px;border-radius:9px;text-decoration:none;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.topic{background:rgba(16,29,48,.94);border:1px solid var(--line);border-radius:14px;padding:16px}.topic h2{margin:0;color:#ddd6fe;font-size:19px}.topic p{color:var(--muted);margin:8px 0}.steps{background:var(--card2);border-right:4px solid var(--good);border-radius:8px;padding:9px;color:#e1f5e8}.formula{background:#06101c;color:#a8edff;padding:7px;text-align:center;direction:ltr;border-radius:7px;font-family:monospace}.num{display:inline-block;background:#2d366c;color:#fff;border-radius:50%;width:28px;height:28px;text-align:center;margin-left:6px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><header class="hero"><h1>📚 المقرر الكامل للجبر الخطي</h1><p>هذه الصفحة تجمع جميع الموضوعات الداخلة في الاختبار، مع فكرة مبسطة وقاعدة العمل لكل موضوع.</p></header><div class="actions"><a class="btn" href="index.html">التمارين التفاعلية</a><a class="btn" href="lessons.html">صفحة الشرح</a><a class="btn" href="pdf-questions.html">أسئلة PDF</a></div><section class="grid" id="grid"></section></main><script>
const topics=[
['منظومة المعادلات الخطية','مجموعة معادلات نبحث عن قيم تحققها كلها.','الحذف: وحّد معاملات متغير ثم اجمع/اطرح، أوجد المتغير، عوّض، وتحقق.'],
['المصفوفات والعمليات عليها وخواصها','نضيف العناصر المتناظرة ��ي الجمع، ونضرب الصف في العمود في الضرب.','A(m×n)B(n×p) معرف، والناتج m×p. الجمع تبديلي، والضرب غير تبديلي غالباً.'],
['أنواع المصفوفات','منها المربعة، الصفية، العمودية، الصفرية، القطرية، الوحدة، والمثلثية.','افحص الأبعاد ومواقع الأصفار بالنسبة للقطر الرئيسي.'],
['كتابة عناصر مصفوفة بحسب الشروط','إذا أعطيت قاعدة aᵢⱼ، عوّض رقم الصف i ورقم العمود j لكل موضع.','مثال: aᵢⱼ=i+j؛ إذن a₂₃=2+3=5.'],
['المصفوفات الأولية','هي مصفوفة تنتج من تطبيق عملية سطرية واحدة على مصفوفة الوحدة.','تبديل صفين، ضرب صف في عدد غير صفري، أو إضافة مضاعف صف إلى صف آخر.'],
['العمليات السطرية','عمليات لا تغيّر مجموعة حلول النظام عند تطبيقها على المصفوفة الموسعة.','Rᵢ↔Rⱼ، Rᵢ←kRᵢ، Rᵢ←Rᵢ+kRⱼ.'],
['معكوس المصفوفة بطريقة جاوس','نكتب [A|I] ونحوّل A إلى I؛ الطرف الآخر يصبح A⁻¹.','يشترط أن تكون A مربعة وdet(A)≠0.'],
['المحددات وقيمة المحدد','لـ2×2 نستخدم ad−bc، وللمثلثية نضرب القطر الرئيسي.','[[a,b],[c,d]]: det=ad−bc. اكتب القطرين ثم اطرح.'],
['خواص المحددات','det(Aᵀ)=det(A)، وdet(AB)=det(A)det(B). تبديل صفين يعكس الإشارة.','صفان متساويان أو صف صفري يعني det=0.'],
['العوامل المرافقة في المحددات','العامل المرافق Cᵢⱼ يساوي إشارة الموضع مضروبة في القاصر.','Cᵢⱼ=(-1)ⁱ⁺ʲ Mᵢⱼ؛ احذف الصف i والعمود j ثم احسب المحدد.'],
['المتجهات','المتجه قائمة مركبات لها مقدار واتجاه ويمكن جمعه وضربه بعدد.','اجمع المركبات المتناظرة، واحسب الطول بجذر مجموع المربعات.'],
['الضرب العددي وإيجاد الزاوية','الضرب العددي ينتج عدداً ويساعد على إيجاد الزاوية والتعامد.','u·v=||u||||v||cosθ، ومنه θ=cos⁻¹((u·v)/(||u||||v||)).'],
['خواص الضرب العددي','الضرب العددي تبديلي وتوزيعي ويرتبط بالطول.','u·v=v·u، وu·(v+w)=u·v+u·w، وu·u=||u||².'],
['المركبات الأفقية والعمودية','نحلل المتجه المائل إلى مركبتين متعامدتين بالنسبة للمحورين.','الأفقية=r cosθ، والعمودية=r sinθ؛ انتبه إلى الربع والإشارة.'],
['الضرب الاتجاهي','ينتج متجهاً عمودياً على متجهي الضرب في R³.','||u×v||=||u||||v||sinθ، وi×j=k، وj×i=−k.'],
['المتجهات الواحدية وخواصها','المتجه الواحدي طوله 1 وله نفس اتجاه المتجه الأصلي.','v̂=v/||v||؛ احسب الطول أولاً ثم اقسم كل مركبة عليه.'],
['المستقيمات والمستويات في الفضاء R³','المستقيم يحتاج نقطة ومتجه اتجاه، والمستوى يحتاج نقطة ومتجهاً عمودياً.','r=r₀+tv، والمستوى a(x−x₀)+b(y−y₀)+c(z−z₀)=0.'],
['البعد بين نقطتين','نستخدم فرق الإحداثيات ثم الجذر التربيعي لمجموع المربعات.','d=√((x₂−x₁)²+(y₂−y₁)²+(z₂−z₁)²).'],
['بعد نقطة عن مستوى','نعوّض إحداثيات النقطة في بسط قانون المسافة ثم نقسم على طول العمودي.','d=|ax₀+by₀+cz₀+d|/√(a²+b²+c²).'],
['فضاء المتجهات','مجموعة مغلقة تحت الجمع والضرب القياسي وتحتوي صفراً ومعكوس كل عنصر.','اختبر الإغلاق: هل الناتج يبقى داخل المجموعة؟'],
['الارتباط والاستقلال الخطي','الاستقلال يعني أن التركيبة الصفرية لها الحل الصفري فقط.','ضع المتجهات أعمدة؛ في المصفوفة المربعة det≠0 يعني استقلالاً.'],
['المتجهات المتعامدة','متجهان متعامدان إذا كان ضربهما العددي صفراً.','احسب u·v؛ إذا كان 0 فهما متعامدان.'],
['المتجهات القياسية والمتعامدة قياسياً','المتجه القياسي/الواحدي طوله 1، والمجموعة المتعامدة قياسياً متعامدة وكل عناصرها واحدية.','تحقق من u·v=0 للأزواج ومن ||u||=1 لكل متجه.'],
['التحويلات الخطية','تحويل يحفظ الجمع والضرب القياسي، ويمثل غالباً بمصفوفة.','T(u+v)=T(u)+T(v)، وT(cu)=cT(u)، وبالتالي T(0)=0.']
];
const grid=document.getElementById('grid');grid.innerHTML=topics.map((x,i)=>`<article class="topic"><h2><span class="num">${i+1}</span>${x[0]}</h2><p>${x[1]}</p><div class="steps"><b>قاعدة وخطوات سريعة:</b><br>${x[2]}</div></article>`).join('');
</script></body></html>
