<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسئلة PDF</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:Tahoma,Arial;line-height:1.9}.wrap{max-width:1000px;margin:auto;padding:24px}.box,.q{background:#101d30;border:1px solid #3b587e;border-radius:12px;padding:15px;margin:12px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #526f97}.tools input,.tools select{background:#172942;color:#fff;flex:1;min-width:180px}button{background:#7767f5;color:#fff;cursor:pointer}.topic{margin-top:18px}.topic h2{background:#2b356b;padding:10px;border-radius:9px}.muted{color:#b3c6dc}.solution{margin-top:8px;padding:9px;background:#063b34;border-right:4px solid #22c55e}.error{color:#fca5a5}</style></head><body><main class="wrap"><h1>📄 أسئلة ملف تمارين الجبر الخطي</h1><div class="box"><div class="tools"><button id="extract">استخراج/تحديث الأسئلة</button><input id="search" placeholder="بحث..."><select id="filter"><option value="all">كل الموضوعات</option></select></div><p id="status" class="muted">اضغط استخراج/تحديث الأسئلة بعد تشغيل server.js.</p></div><div id="app"></div></main><script>let data={questions:[]};const $=id=>document.getElementById(id);function render(){let term=$('search').value.toLowerCase(),filter=$('filter').value,list=data.questions.filter(q=>(filter==='all'||q.topic===filter)&&(!term||q.question.toLowerCase().includes(term))),groups={};list.forEach(q=>(groups[q.topic]??=[]).push(q));$('app').innerHTML=list.length?Object.entries(groups).map(([t,qs])=>`<section class="topic"><h2>${t} (${qs.length})</h2>${qs.map((q,i)=>`<article class="q"><b>${i+1}. ${q.question}</b><div class="muted">الصفحة ${q.page}</div><div class="solution"><b>خطوات الحل:</b><br>حدد المطلوب والمعطيات، اكتب القاعدة، عوّض، احسب، ثم تحقق من الناتج. أضف الحل الخاص بالسؤال في البيانات إذا كان متوفراً.</div></article>`).join('')}</section>`).join(''):'<div class="box muted">لا توجد أسئلة أو لم يتم استخراجها بعد.</div>'}async function load(){try{let r=await fetch('/api/questions');if(!r.ok)throw Error('شغّل npm run extract أولاً');data=await r.json();$('status').textContent=`تم تحميل ${data.questionCount} سؤالاً من ${data.pageCount} صفحة.`;[...new Set(data.questions.map(q=>q.topic))].sort().forEach(t=>$('filter').insertAdjacentHTML('beforeend',`<option>${t}</option>`));render()}catch(e){$('status').innerHTML=`<span class="error">${e.message}</span>`}}$('extract').onclick=async()=>{let r=await fetch('/api/extract',{method:'POST'});if(r.ok)load();else $('status').textContent='تعذر الاستخراج؛ تحقق من نوع PDF.'};$('search').oninput=render;$('filter').onchange=render;load();</script></body></html>
