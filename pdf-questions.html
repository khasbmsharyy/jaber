<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسئلة PDF — الجبر الخطي</title>
<style>
:root{--bg:#0f0c29;--card:#1e1b4b;--line:#4c1d95;--accent:#8b5cf6;--good:#86efac}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg),#302b63);color:#f8fafc;font-family:Tahoma,Arial,sans-serif;line-height:1.9}header{padding:28px 16px;text-align:center}h1{margin:0;color:#ddd6fe}.hint{color:#c4b5fd}main{max-width:1000px;margin:auto;padding:0 16px 50px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 20px}.toolbar input,.toolbar select{background:#020617;color:white;border:1px solid #64748b;border-radius:8px;padding:10px;flex:1;min-width:180px}.topic{margin:22px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(30,27,75,.8)}.topic h2{margin:0;padding:12px 16px;background:rgba(139,92,246,.25);font-size:20px}.topic .explain{padding:12px 16px;color:#ddd6fe}.q{margin:12px 16px;padding:14px;border:1px solid #4338ca;border-radius:10px;background:#172554}.q strong{display:block}.solution{margin-top:10px;padding:10px;border-right:4px solid var(--good);background:#052e2b;color:#d1fae5}.empty{padding:30px;text-align:center;color:#cbd5e1}.page{font-size:12px;color:#c4b5fd}
</style></head>
<body><header><h1>📘 أسئلة الجبر الخطي من ملف PDF</h1><p class="hint">تُعرض الأسئلة مرتبة حسب الموضوع، مع صفحة المصدر والحل الموجود في ملف البيانات.</p></header>
<main><div class="toolbar"><input id="search" placeholder="ابحث في الأسئلة…"><select id="topic"><option value="">كل الموضوعات</option></select></div><div id="app" class="empty">جاري تحميل الأسئلة…</div></main>
<script>
const explanations={"المعادلات الخطية":"نرتب المعادلات، ثم نستخدم الحذف أو التعويض، ونتحقق من الحل في المعادلات الأصلية.","المصفوفات":"نحدد الأبعاد أولاً؛ في الجمع نطابق العناصر، وفي الضرب نضرب الصف في العمود.","المحددات والمعكوس":"لـ 2×2 نحسب ad−bc. يوجد المعكوس فقط عندما لا يساوي المحدد صفراً.","المتجهات":"نحسب المركبات واحدةً واحدة؛ الضرب القياسي يجمع جداءات المركبات، والطول هو جذر مجموع المربعات.","الفضاءات والمتعة الخطية":"نختبر الإغلاق ثم نحل التركيبة الخطية التي تساوي المتجه الصفري.","المستقيمات والمستويات":"نستخرج متجه الاتجاه أو العمودي، ثم نعوض النقطة في الصيغة المناسبة."};
let data={questions:[]};
const app=document.getElementById('app'), search=document.getElementById('search'), topic=document.getElementById('topic');
function render(){const q=data.questions.filter(x=>(!topic.value||x.topic===topic.value)&&(!search.value||x.question.includes(search.value)));const groups={};q.forEach(x=>(groups[x.topic]??=[]).push(x));app.innerHTML=q.length?Object.entries(groups).map(([name,items])=>`<section class="topic"><h2>${name}</h2><div class="explain">${explanations[name]||'اقرأ المعطيات، حدد القانون المناسب، ثم نفّذ الحساب خطوة بخطوة وتحقق من النتيجة.'}</div>${items.map((x,i)=>`<article class="q"><strong>${i+1}. ${x.question}</strong><span class="page">صفحة ${x.page}</span>${x.solution?`<div class="solution"><b>الحل خطوة بخطوة:</b><br>${x.solution}</div>`:`<div class="solution"><b>طريقة الحل:</b><br>حدد المطلوب والمعطيات، اكتب القانون، عوّض القيم، بسّط الناتج، ثم تحقق منه. أضف الحل التفصيلي في pdf_questions.json إذا كان موجوداً في المصدر.</div>`}</article>`).join('')}</section>`).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}
fetch('pdf_questions.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{data=x;[...new Set(x.questions.map(q=>q.topic))].sort().forEach(t=>topic.insertAdjacentHTML('beforeend',`<option>${t}</option>`));render()}).catch(()=>app.innerHTML='<div class="empty">لم يتم العثور على pdf_questions.json. شغّل أداة الاستخراج أولاً.</div>');search.oninput=render;topic.onchange=render;
</script></body></html>
