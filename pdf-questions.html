<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أسئلة PDF | أكاديمية الجبر الخطي</title>
<style>
body{margin:0;background:#08111f;color:#edf5ff;font-family:Tahoma,Arial;line-height:1.9}.wrap{max-width:1050px;margin:auto;padding:20px}.hero{text-align:center}.hero h1{color:#cfc5ff}.panel{background:#101d30;border:1px solid #39577d;border-radius:14px;padding:16px;margin:14px 0}.btn,input,select{font:inherit;border-radius:8px;padding:9px 12px;border:1px solid #48698f}.btn{background:#7664f4;color:#fff;cursor:pointer}.btn.alt{background:#294363}input,select{background:#172942;color:#fff}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:200px}.topic{border:1px solid #536fa0;border-radius:12px;margin:15px 0;background:#14263e;overflow:hidden}.topic h2{margin:0;padding:12px;background:#293565;color:#eee}.question{padding:13px;border-top:1px solid #385375}.solution{margin-top:8px;padding:10px;background:#063b34;border-right:4px solid #22c55e;color:#d5fbe0}.muted{color:#b1c5dd}.error{color:#fca5a5}.loading{color:#fde68a}.hidden{display:none}
</style></head><body><main class="wrap"><header class="hero"><h1>📄 أسئلة ملف الجبر الخطي</h1><p class="muted">يقرأ الموقع ملف الـPDF مباشرة في المتصفح، ثم يصنف الأسئلة حسب الموضوع. لا يحتاج إلى ملف JSON مولّد مسبقًا.</p></header><section class="panel"><div class="tools"><button class="btn" id="load">تحميل أسئلة PDF</button><a class="btn alt" href="تمارين%20جبر%20خطي(2).pdf" target="_blank">فتح ملف PDF</a><input id="search" placeholder="بحث في الأسئلة..."><select id="filter"><option value="all">كل الموضوعات</option></select></div><p id="status" class="loading">اضغط «تحميل أسئلة PDF» لبدء القراءة.</p></section><div id="app"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script type="module">
const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const $=id=>document.getElementById(id),questions=[];const topics=[['المعادلات الخطية',['معادلات','منظومة','جاوس','الحذف','حل النظام']],['المصفوفات',['مصفوف','رتبة','صف','عمود','منقولة']],['المحددات والمعكوس',['محدد','det','معكوس','مرافق']],['المتجهات',['متجه','ضرب قياسي','ضرب اتجاهي','زاوية','طول المتجه']],['الفضاءات والتحويلات',['فضاء','استقلال','ارتباط','تحويل خطي']],['المستقيمات والمستويات',['مستقيم','مستوى','المسافة','نقطة']]];
function topicOf(text){for(const [name,words] of topics)if(words.some(w=>text.toLowerCase().includes(w.toLowerCase())))return name;return 'عام'}
function clean(s){return s.replace(/\s+/g,' ').trim()}
function parse(pageText,page){let text=pageText.replace(/\r/g,'\n');let numbered=[...text.matchAll(/(?:^|\n)\s*(?:سؤال\s*)?([0-9٠-٩]+)[\)\.\-:：]\s*([\s\S]*?)(?=\n\s*(?:سؤال\s*)?[0-9٠-٩]+[\)\.\-:：]|$)/g)];if(numbered.length){numbered.forEach(m=>questions.push({topic:topicOf(m[2]),question:clean(m[2]),page}));return}clean(text).split(/(?<=[؟?])/).map(clean).filter(x=>x.length>12&&(x.includes('؟')||x.includes('?'))).forEach(q=>questions.push({topic:topicOf(q),question:q,page}))}
function render(){let term=$('search').value.trim().toLowerCase(),f=$('filter').value;let list=questions.filter(q=>(f==='all'||q.topic===f)&&(!term||q.question.toLowerCase().includes(term)));let groups={};list.forEach(q=>(groups[q.topic]??=[]).push(q));$('app').innerHTML=list.length?Object.entries(groups).map(([t,qs])=>`<section class="topic"><h2>${t} (${qs.length})</h2>${qs.map((q,i)=>`<article class="question"><b>${i+1}. ${q.question}</b><div class="muted">الصفحة ${q.page}</div><div class="solution"><b>طريقة الحل:</b><br>حدد المعطيات والمطلوب، اختر القاعدة المناسبة، عوّض القيم، نفّذ الحساب خطوة بخطوة، ثم تحقق من الناتج.</div></article>`).join('')}</section>`).join(''):'<section class="panel muted">لم يتم العثور على أسئلة. إذا كان الملف مصورًا، ستحتاج نسخة OCR قابلة لتحديد النص.</section>'}
$('load').onclick=async()=>{try{$('status').textContent='جارٍ قراءة ملف PDF...';questions.length=0;let pdf=await pdfjs.getDocument('تمارين%20جبر%20خطي(2).pdf').promise;for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();parse(c.items.map(x=>x.str).join('\n'),i)};[...new Set(questions.map(q=>q.topic))].sort().forEach(t=>$('filter').insertAdjacentHTML('beforeend',`<option>${t}</option>`));$('status').textContent=`تم استخراج ${questions.length} سؤالاً من ${pdf.numPages} صفحة.`;render()}catch(e){$('status').innerHTML='<span class="error">تعذر قراءة PDF تلقائياً. تأكد من تشغيل الموقع عبر GitHub Pages أو خادم HTTP، وليس file://.</span>'}};$('search').oninput=render;$('filter').onchange=render;
</script></body></html>
