<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملاحظات سريعة للجبر الخطي</title><style>body{margin:0;background:#08111f;color:#eef5ff;font-family:Tahoma,Arial;line-height:1.9}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#101d30;border:1px solid #3b587e;border-radius:12px;padding:14px;margin:12px 0}.card h2{color:#d9d0ff;margin:0}.rule{background:#06101c;color:#a9efff;padding:8px;text-align:center;direction:ltr;border-radius:7px;font-family:monospace}.step{color:#b3c6dc}.btn{display:inline-block;background:#7767f5;color:#fff;text-decoration:none;border-radius:8px;padding:8px 12px;margin:4px}</style></head><body><main class="wrap"><h1>🧠 ورقة المراجعة السريعة</h1><p>احفظ الفكرة والقانون، ثم طبّق الخطوات على مثال.</p><a class="btn" href="index.html">التمارين</a><a class="btn" href="curriculum.html">المقرر</a><div id="app"></div></main><script>const notes=[['منظومة المعادلات','الحذف: ساوِ المعاملات، اجمع/اطرح، أوجد المتغير، عوّض، تحقق.'],['المصفوفات','الجمع متناظر؛ الضرب صف في عمود؛ أبعاد AB هي الأبعاد الخارجية بعد توافق الداخلية.'],['المحددات','2×2: ad−bc؛ المثلثية: ضرب القطر؛ det=0 يعني لا معكوس.'],['المصفوفات الأولية والعمليات السطرية','ثلاث عمليات: تبديل صفين، ضرب صف بعدد غير صفر، إضافة مضاعف صف لصف.'],['المعكوس','اكتب [A|I]، حوّل اليسار إلى I، اليمين هو المعكوس.'],['العوامل المرافقة','احذف الصف والعمود لإيجاد القاصر، ثم اضرب في الإشارة (−1)^(i+j).'],['الضرب العددي والزاوية','u·v مجموع جداءات المركبات؛ cosθ=(u·v)/(||u||||v||).'],['المركبات','الأفقية=r cosθ؛ العمودية=r sinθ.'],['الضرب الاتجاهي','i×j=k؛ عكس الترتيب يغيّر الإشارة؛ الطول مساحة متوازي الأضلاع.'],['المتجه الواحدي','احسب ||v|| ثم اقسم كل مركبة عليه: v̂=v/||v||.'],['المستقيم والمستوى','المستقيم r=r₀+tv؛ المستوى a(x−x₀)+b(y−y₀)+c(z−z₀)=0.'],['المسافة','بين نقطتين: جذر مجموع مربعات الفروق؛ عن مستوى: قيمة البسط المطلقة على طول العمودي.'],['الاستقلال والتعامد','det≠0 يعني استقلالًا للمصفوفة المربعة؛ u·v=0 يعني تعامدًا.'],['فضاء المتجهات','اختبر الإغلاق تحت الجمع والضرب القياسي ووجود الصفر.'],['التحويلات الخطية','تحقق من T(u+v)=T(u)+T(v) وT(cu)=cT(u)؛ يجب T(0)=0.']];document.getElementById('app').innerHTML=notes.map((n,i)=>`<article class="card"><h2>${i+1}. ${n[0]}</h2><p>${n[1]}</p></article>`).join('');</script></body></html>
