const KEY='la_complete_v4';let state=JSON.parse(localStorage.getItem(KEY)||'{}'),active=0;const $=id=>document.getElementById(id),total=T.reduce((n,t)=>n+t[4].length,n=0);
function stats(){let v=Object.values(state),o=v.filter(x=>x==='ok').length,b=v.filter(x=>x==='bad').length,p=Math.round(o/total*100);$('ok').textContent=o;$('bad').textContent=b;$('pct').textContent=p+'%';$('progress').style.width=p+'%'}function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}
function side(){ $('topics').innerHTML=T.map((t,i)=>`<button class="topicBtn ${i===active?'active':''}" data-i="${i}">${i+1}. ${t[0]}<small>${t[4].length} تمارين</small></button>`).join('');document.querySelectorAll('.topicBtn').forEach(x=>x.onclick=()=>{active=+x.dataset.i;render()}) }
function card(q,qi){let id=active+'_'+qi,s=state[id];return `<article class="q" id="q${id}"><span class="tag">تمرين ${qi+1} · المستوى ${q[4]}</span><h3>${q[0]}</h3><div class="opts">${q[1].map((o,k)=>`<button class="opt ${s&&k===q[2]?'correct':''}" data-id="${id}" data-k="${k}" ${s?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback ${s==='ok'?'good':s==='bad'?'bad':''}">${s==='ok'?'✅ صحيح!':s==='bad'?'❌ خطأ، راجع الحل.':''}</div><div class="solution ${s?'show':''}"><b>الحل خطوة بخطوة:</b><br>${q[3]}</div></article>`}
function render(){side();let t=T[active],term=$('search').value.toLowerCase(),lev=$('level').value,list=t[4].map((q,i)=>[q,i]).filter(([q])=>(lev==='all'||q[4]===lev)&&(!term||(t[0]+' '+q[0]).toLowerCase().includes(term)));let h=`<div class="card head"><h2>${active+1}. ${t[0]}</h2><p class="muted">${t[1]}</p><div class="lesson"><b>القاعدة:</b> ${t[2]}<br><b>مثال:</b> ${t[3]}</div></div>`;h+=list.length?list.map(([q,i])=>card(q,i)).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>';$('app').innerHTML=h;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let [ti,qi]=b.dataset.id.split('_').map(Number),q=T[ti][4][qi],ok=+b.dataset.k===q[2];state[b.dataset.id]=ok?'ok':'bad';save();render();setTimeout(()=>$('q'+b.dataset.id)?.scrollIntoView({behavior:'smooth',block:'center'}),20)});stats()}
$('search').oninput=render;$('level').onchange=render;$('reset').onclick=()=>{if(confirm('تصفير النتائج؟')){state={};save();render()}};$('random').onclick=()=>{active=Math.floor(Math.random()*T.length);$('search').value='';$('level').value='all';render();let q=document.querySelectorAll('.q');if(q.length)q[Math.floor(Math.random()*q.length)].scrollIntoView({behavior:'smooth',block:'center'})};render();
