<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أكاديمية الجبر الخطي</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #101d30;
      --panel-2: #15263f;
      --line: #35507a;
      --primary: #7c6af6;
      --primary-2: #32d7ff;
      --good: #22c55e;
      --bad: #ef4444;
      --gold: #f8d56b;
      --text: #edf3ff;
      --muted: #aec3dc;
      --soft: #dfeafc;
      --shadow: 0 16px 40px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #07111d 0%, #102241 38%, #1b2d4d 100%);
      color: var(--text);
      line-height: 1.9;
    }

    a { color: inherit; }
    button, input { font: inherit; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8, 17, 31, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
    }
    .badge {
      background: rgba(16, 29, 48, 0.9);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .badge b { color: var(--gold); }
    .progress-wrap {
      width: 180px;
      height: 9px;
      background: #20324f;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .progress-wrap span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: .3s ease;
    }
    .btn {
      background: linear-gradient(135deg, var(--primary), #5d9bff);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .btn.alt {
      background: #253d5b;
    }

    .hero {
      text-align: center;
      padding: 32px 18px 20px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      background: linear-gradient(90deg, #cab8ff, #6cf0ff, #fff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      margin: 10px auto 0;
      max-width: 780px;
      color: var(--muted);
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px 44px;
    }

    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 18px;
    }

    .side {
      padding: 14px;
      background: rgba(16, 29, 48, 0.9);
      border: 1px solid var(--line);
      border-radius: 16px;
      position: sticky;
      top: 72px;
      height: max-content;
      box-shadow: var(--shadow);
    }
    .side h2 {
      margin: 4px 4px 10px;
      font-size: 18px;
      color: var(--soft);
    }
    .topics {
      display: grid;
      gap: 8px;
    }
    .topic-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 10px;
      text-align: right;
      cursor: pointer;
      transition: .2s ease;
    }
    .topic-btn:hover, .topic-btn.active {
      background: rgba(124, 106, 246, 0.18);
      border-color: rgba(124, 106, 246, 0.7);
      color: white;
    }
    .topic-btn small {
      display: block;
      color: #9fb5cf;
      margin-top: 4px;
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
    }
    .toolbar input {
      flex: 1;
      min-width: 200px;
      background: rgba(16, 29, 48, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .toolbar input::placeholder { color: #a9c0db; }

    .card {
      background: rgba(16, 29, 48, 0.88);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .topic-head {
      padding: 18px 20px 12px;
    }
    .topic-head h2 {
      margin: 0;
      color: #f0ebff;
    }
    .topic-head .desc {
      color: var(--muted);
      margin-top: 8px;
      font-size: 15px;
    }
    .formula {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px dashed rgba(79, 126, 220, 0.9);
      background: rgba(6, 16, 28, 0.9);
      border-radius: 10px;
      text-align: center;
      direction: ltr;
      color: #a9ecff;
      font-family: Consolas, monospace;
    }

    .chapter-box {
      padding: 16px;
      border: 1px solid rgba(124, 106, 246, 0.32);
      border-radius: 12px;
      background: rgba(124, 106, 246, 0.08);
      color: var(--soft);
      margin-top: 12px;
    }
    .chapter-box strong { color: #fff; }

    .question {
      margin-top: 16px;
      background: rgba(21, 38, 63, 0.96);
      border: 1px solid rgba(78, 120, 196, 0.9);
      border-radius: 14px;
      padding: 16px;
    }
    .question small {
      color: #9bb8d7;
    }
    .question h3 {
      margin: 8px 0 10px;
      font-size: 17px;
      line-height: 1.8;
    }
    .options {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .option {
      width: 100%;
      text-align: right;
      background: #1f2e46;
      color: var(--text);
      border: 1px solid #4f6787;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: .15s ease;
    }
    .option:hover:not(:disabled) {
      border-color: rgba(124, 106, 246, 0.8);
      transform: translateX(-2px);
    }
    .option:disabled { cursor: default; }
    .option.correct {
      background: #0c4f34;
      border-color: var(--good);
      color: #dffdf0;
    }
    .option.wrong {
      background: #5f1a28;
      border-color: var(--bad);
      color: #fee2e2;
    }
    .feedback {
      margin-top: 10px;
      font-weight: bold;
      min-height: 22px;
    }
    .feedback.good { color: #86efac; }
    .feedback.bad { color: #fca5a5; }
    .solution {
      display: none;
      margin-top: 12px;
      background: rgba(5, 55, 44, 0.95);
      border: 1px solid rgba(34, 197, 94, 0.9);
      border-radius: 10px;
      padding: 12px 14px;
      color: #d6fadd;
    }
    .solution.show { display: block; }
    .solution b { color: #f0fdf4; }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
      background: rgba(16, 29, 48, 0.9);
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 20px 15px 36px;
    }

    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .topics { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="badge">✅ صحيح: <b id="okCount">0</b></span>
    <span class="badge">❌ خاطئ: <b id="badCount">0</b></span>
    <span class="badge">📊 نسبة التقدم: <b id="percent">0%</b></span>
    <div class="progress-wrap"><span id="progressBar"></span></div>
    <button class="btn alt" id="resetBtn">تصفير</button>
  </div>

  <header class="hero">
    <h1>📐 أكاديمية الجبر الخطي</h1>
    <p>محتوى تعليمي متكامل، تمارين تفاعلية، شرح مبسط، وحلول خطوة بخطوة لتعلم الجبر الخطي بطريقة عملية وسهلة.</p>
  </header>

  <main class="container">
    <div class="layout">
      <aside class="side">
        <h2>محتوى المقرر</h2>
        <div id="topics" class="topics"></div>
      </aside>

      <section class="main-panel">
        <div class="toolbar">
          <input id="searchInput" type="text" placeholder="ابحث عن سؤال أو موضوع..." />
          <button id="randomBtn" class="btn">🎲 تمرين عشوائي</button>
        </div>
        <div id="app"></div>
      </section>
    </div>
  </main>

  <footer>✦ حاول أولاً ثم راجع الحل، فالتكرار والممارسة هي مفتاح الإتقان ✦</footer>

  <script>
    const course = [
      {
        title: 'منظومة المعادلات الخطية',
        desc: 'نحل منظومة معادلات خطية باستخدام التعويض أو الحذف. الهدف هو إيجاد القيم التي تحقق كل المعادلات دفعة واحدة.',
        formula: 'x + y = 5,  x - y = 1',
        notes: 'إذا كانت المعادلتان تعطيان نفس الخط، فهناك حل لا نهائي. وإذا أعطت تناقضاً مثل 2 = 5، فالمجموعة لا حل لها.',
        questions: [
          { q: 'حل المنظومة التالية: x + y = 5 ، x - y = 1', opts: ['x=2, y=3', 'x=3, y=2', 'x=4, y=1', 'x=1, y=4'], ans: 1, sol: 'بجمع المعادلتين: (x+y)+(x-y)=5+1 => 2x=6 => x=3. نعوض في المعادلة الأولى: 3+y=5 => y=2. إذن الحل هو x=3, y=2.' },
          { q: 'إذا كان y = 2x و x + y = 9، فما قيمة x؟', opts: ['2', '3', '4', '9'], ans: 1, sol: 'نعوض y=2x في المعادلة الثانية: x + 2x = 9 => 3x = 9 => x = 3.' },
          { q: 'ما نوع حل المنظومة التالية: x + y = 2 و x + y = 5؟', opts: ['حل وحيد', 'حلول لا نهائية', 'لا حل', 'حلان فقط'], ans: 2, sol: 'الطرفان الأيسر متطابقان، لكن الطرفان الأيمن مختلفان، لذلك الخطان متوازيان ولا يتقاطعان. إذن لا يوجد حل.' },
          { q: 'إذا كانت 2x = 8 فما قيمة x؟', opts: ['2', '4', '6', '8'], ans: 1, sol: 'نقسم الطرفين على 2: x = 4.' }
        ]
      },
      {
        title: 'العمليات على المصفوفات',
        desc: 'المصفوفة هي جدول من الأرقام; يمكن جمعها وطرحها إذا كانت بنفس الأبعاد، أما الضرب فيتطلب توافق الأبعاد.',
        formula: 'A(m×n) × B(n×p) = C(m×p)',
        notes: 'ضرب المصفوفات غير تبديلي غالباً، أي أن AB لا يساوي BA دائماً.',
        questions: [
          { q: 'إذا كانت A = [1 2; 3 4] و B = [5 6; 7 8]، فإن A + B تساوي:', opts: ['[6 8; 10 12]', '[5 12; 21 32]', '[4 4; 4 4]', '[6 8; 10 11]'], ans: 0, sol: 'نجمع كل عنصر مع نظيره: 1+5=6، 2+6=8، 3+7=10، 4+8=12. إذن الناتج هو [6 8; 10 12].' },
          { q: '[1 2] × [3; 4] = ?', opts: ['7', '10', '11', '24'], ans: 2, sol: 'الضرب يتم كالتالي: (1×3)+(2×4)=3+8=11.' },
          { q: 'إذا كانت A من الحجم 2×3، فكم يجب أن يكون عدد صفوف B لكي يكون الضرب AB معرفاً؟', opts: ['2', '3', '4', 'لا يمكن'], ans: 1, sol: 'يجب أن يكون عدد أعمدة A مساوياً لعدد صفوف B. لأن A لها 3 أعمدة، إذن B يجب أن يكون 3×n.' },
          { q: 'هل AB = BA دائماً؟', opts: ['نعم', 'لا', 'فقط إذا كانت المصفوفة مربعة', 'فقط إذا كانت صفرية'], ans: 1, sol: 'ضرب المصفوفات غالباً غير تبديلي، لذلك AB لا يساوي BA في معظم الحالات.' }
        ]
      },
      {
        title: 'أنواع المصفوفات',
        desc: 'تختلف المصفوفات حسب الشكل وموقع الأصفار. من أهمها: المربعة، القطرية، الوحدة، المثلثية، والمنقولة.',
        formula: 'I₃ = [[1,0,0],[0,1,0],[0,0,1]]',
        notes: 'المصفوفة القطرية تحتوي أصفاراً خارج القطر الرئيسي، أما مصفوفة الوحدة فهي مصفوفة قطرية كل عناصر قطرها تساوي 1.',
        questions: [
          { q: 'المصفوفة [1 0; 0 1] تسمى:', opts: ['صفرية', 'وحدية', 'مثلثية', 'مستطيلة'], ans: 1, sol: 'كل عناصر القطر الرئيسي تساوي 1، أما العناصر الأخرى فهي صفر؛ لذلك هي مصفوفة الوحدة.' },
          { q: 'المنقولة للمصفوفة [1 2; 3 4] هي:', opts: ['[1 3; 2 4]', '[4 3; 2 1]', '[1 2; 3 4]', '[2 1; 4 3]'], ans: 0, sol: 'نبدّل الصفوف بالأعمدة: الصف الأول [1,2] يصبح العمود الأول، الصف الثاني [3,4] يصبح العمود الثاني.' },
          { q: 'المصفوفة [2 0 0; 5 3 0; 1 4 7] تصنف على أنها:', opts: ['مثلثية عليا', 'مثلثية سفلى', 'قطرية', 'وحدية'], ans: 1, sol: 'كل العناصر فوق القطر الرئيسي أصفار، لذلك هي مصفوفة مثلثية سفلى.' },
          { q: 'المصفوفة التي تحتوي على عمود واحد فقط تسمى:', opts: ['صفية', 'عمودية', 'مربعة', 'قطرية'], ans: 1, sol: 'المصفوفة العمودية هي مصفوفة بها عمود واحد فقط.' }
        ]
      },
      {
        title: 'المحددات',
        desc: 'المحدد هو قيمة عددية مرتبطة بمصفوفة مربعة. يساعدنا في معرفة ما إذا كانت المصفوفة قابلة للعكس ولمعرفة الاستقلال الخطي.',
        formula: 'det[[a,b],[c,d]] = ad - bc',
        notes: 'للمصفوفة المثلثية، المحدد يساوي حاصل ضرب عناصر القطر الرئيسي فقط.',
        questions: [
          { q: 'det[[3,2],[1,4]] = ?', opts: ['8', '10', '12', '14'], ans: 1, sol: 'الحد: 3×4 - 2×1 = 12 - 2 = 10.' },
          { q: 'det[[5,0],[0,3]] = ?', opts: ['8', '15', '0', '2'], ans: 1, sol: 'هذه مصفوفة قطرية، وبالتالي المحدد = 5×3 = 15.' },
          { q: 'محدد المصفوفة المثلثية ذات القطر 1, 4, 6 يساوي:', opts: ['11', '24', '120', '0'], ans: 1, sol: 'للمصفوفة المثلثية، المحدد = ضرب عناصر القطر = 1×4×6 = 24.' },
          { q: 'إذا كان في المصفوفة صفان متطابقان، فإن المحدد يساوي:', opts: ['1', '-1', '0', 'غير معرف'], ans: 2, sol: 'وجود صفين متطابقين يضمن أن المصفوفة ذات رتبة أقل من كاملها؛ لذلك محددها صفر.' }
        ]
      },
      {
        title: 'المعكوس والعمليات السطرية',
        desc: 'المعكوس A⁻¹ موجود فقط إذا كان المحدد لا يساوي صفرًا. طريقة جاوس-جوردان تعالج [A | I] لتحويل الجانب الأيسر إلى I.',
        formula: '[A | I] → [I | A⁻¹]',
        notes: 'إضافة مضاعف صف إلى صف آخر لا تغير قيمة المحدد، بينما تبديل صفين يغير الإشارة.',
        questions: [
          { q: 'معكوس المصفوفة [[2,0],[0,2]] هو:', opts: ['[[2,0],[0,2]]', '[[1/2,0],[0,1/2]]', '[[0,2],[2,0]]', 'لا يوجد'], ans: 1, sol: 'للمصفوفة القطرية، نأخذ مقلوب كل عنصر على القطر: 1/2 و 1/2.' },
          { q: 'متى لا يوجد المعكوس؟', opts: ['إذا det(A)=1', 'إذا det(A)=-1', 'إذا det(A)=0', 'إذا كانت المصفوفة مثلثية'], ans: 2, sol: 'المعكوس يتطلب قسمة على det(A)، لذلك إذا كان det(A)=0 لا يوجد معكوس.' },
          { q: 'هل العملية R₂ ← R₂ + 3R₁ تغير قيمة المحدد؟', opts: ['نعم', 'لا', 'يضعفه', 'يجعله صفرًا'], ans: 1, sol: 'إضافة مضاعف صف إلى صف آخر لا تغير قيمة المحدد.' },
          { q: 'تبديل صفين في المصفوفة يؤدي إلى:', opts: ['نفس المحدد', 'محدد سالب', 'محدد مضاعف 2', 'صفر'], ans: 1, sol: 'تبديل صفين يغير إشارة المحدد فقط.' }
        ]
      },
      {
        title: 'المتجهات والضرب القياسي',
        desc: 'المتجه له مقدار واتجاه، والضرب القياسي يجمع جداء الإحداثيات. إذا كان الضرب القياسي يساوي صفرًا، فالمتجهان متعامدان.',
        formula: 'u·v = u₁v₁ + u₂v₂ + u₃v₃',
        notes: 'طول المتجه هو جذر مجموع مربعات مركباته: ‖v‖ = √(v₁²+v₂²+v₃²).',
        questions: [
          { q: 'إذا كان u = (1,2,3) و v = (4,5,6) فإن u·v يساوي:', opts: ['21', '28', '32', '41'], ans: 2, sol: 'u·v = 1×4 + 2×5 + 3×6 = 4 + 10 + 18 = 32.' },
          { q: 'طول المتجه (3,4,0) يساوي:', opts: ['3', '4', '5', '7'], ans: 2, sol: '‖v‖ = √(3² + 4² + 0²) = √25 = 5.' },
          { q: 'إذا كان u·v = 0، فالمتجهان:', opts: ['متوازيان', 'متعامدان', 'متساويان', 'صفريان'], ans: 1, sol: 'التعامد يعرف بأن الضرب القياسي يساوي صفرًا.' },
          { q: 'إذا كان u·u = 25 فإن ‖u‖ يساوي:', opts: ['25', '10', '5', '0'], ans: 2, sol: 'u·u = ‖u‖²، لذلك ‖u‖ = √25 = 5.' }
        ]
      },
      {
        title: 'المركبات والضرب الاتجاهي',
        desc: 'المركبة الأفقية للمتجه هي r cos θ، والعمودية هي r sin θ. الضرب الاتجاهي في الفضاء الثلاثي ينتج متجهًا عموديًّا.',
        formula: 'u × v = |u||v|sinθ n̂',
        notes: 'i × j = k، وj × i = -k.',
        questions: [
          { q: 'متجه مقداره 10 ويصنع زاوية 30° مع المحور الأفقي، مركبته الأفقية تساوي:', opts: ['5', '5√3', '10', '10√3'], ans: 1, sol: 'المركبة الأفقية = r cos θ = 10 × cos30° = 10 × √3 / 2 = 5√3.' },
          { q: 'للمتجه نفسه، المركبة العمودية تساوي:', opts: ['5', '5√3', '10', '0'], ans: 0, sol: 'المركبة العمودية = r sin θ = 10 × 1/2 = 5.' },
          { q: 'i × j = ?', opts: ['i', 'j', 'k', '-k'], ans: 2, sol: 'قاعدة الاتجاهات القياسية تقول: i × j = k.' },
          { q: 'j × i = ?', opts: ['k', '-k', 'i', '0'], ans: 1, sol: 'الضرب الاتجاهي غير تبديلي، لذا j × i = -(i × j) = -k.' }
        ]
      },
      {
        title: 'المستقيمات والمستويات والمسافة',
        desc: 'المستقيم في الفضاء يُعطى بنقطة + متجه اتجاه. المستوى يُعطى بنقطة + متجه عمودي.المسافة تحتسب وفق القاعدة المناسبة.',
        formula: 'r = r₀ + t v  ،  a(x-x₀)+b(y-y₀)+c(z-z₀)=0',
        notes: 'بعد النقطة عن المستوى = |ax₀ + by₀ + cz₀ + d| / √(a²+b²+c²).',
        questions: [
          { q: 'مستقيم يمر بالنقطة (1,2,3) ومتجه اتجاهه (1,0,-1)، معادلته هي:', opts: ['r=(1,2,3)+t(1,0,-1)', 'r=(1,0,-1)+t(1,2,3)', 'x+y+z=1', 'لا يمكن'], ans: 0, sol: 'الصيغة العامة هي النقطة + t × متجه الاتجاه: (1,2,3)+t(1,0,-1).' },
          { q: 'العمودي على المستوى 2x-y+3z=5 هو:', opts: ['(2,-1,3)', '(2,1,3)', '(5,0,0)', '(1,2,3)'], ans: 0, sol: 'معاملات x و y و z في معادلة المستوى تمثل المتجه العمودي على المستوى.' },
          { q: 'المسافة بين (1,2,3) و (4,6,3) تساوي:', opts: ['4', '5', '6', '25'], ans: 1, sol: 'd = √[(4-1)²+(6-2)²+(3-3)²] = √(9+16)=5.' },
          { q: 'النقطة (2,3,1) على المستوى x + 2y + 2z - 10 = 0 لها بعد يساوي:', opts: ['0', '1', '3', '5'], ans: 0, sol: 'نعوض: 2+6+2-10=0، وبالتالي النقطة تقع على المستوى، وبعدها صفر.' }
        ]
      },
      {
        title: 'الفضاءات والاستقلال الخطي',
        desc: 'فضاء المتجهات هو مجموعة مغلقة تحت جمع المتجهات وضربها بعدد حقيقي. المتجهات مستقلة إذا لم يكن يمكن التعبير عن أحدها بمعادلة خطية للآخرين.',
        formula: 'c₁v₁ + c₂v₂ + ... + cₙvₙ = 0',
        notes: 'إذا كان هناك حل غير صفري، فالمتجهات مرتبطة خطياً، وإذا كان الحل الوحيد هو الصفري، فهي مستقلة خطياً.',
        questions: [
          { q: 'المتجهان (1,0) و (0,1) هما:', opts: ['مرتبطان', 'مستقلان', 'متساويان', 'صفريان'], ans: 1, sol: 'هما أساس المستوى، ولا يمكن كتابة أحدهما كضرب ثابت للآخر، لذلك هما مستقلان.' },
          { q: 'المتجهان (1,2) و (2,4) هما:', opts: ['مستقلان', 'مرتبطان', 'متعامدان', 'وحديان'], ans: 1, sol: 'الثاني يساوي 2×الأول؛ لذلك المتجهان مرتبطان خطياً.' },
          { q: 'أي مجموعة متجهات تحتوي على المتجه الصفري تكون:', opts: ['مستقلة', 'مرتبطة', 'متعامدة', 'غير معرّفة'], ans: 1, sol: 'وجود المتجه الصفري يسمح بالتعبير بتركيبة غير صفرية تساوي صفرًا، لذلك المجموعة مرتبطة.' },
          { q: 'R² هل يمثل فضاء متجهات؟', opts: ['نعم', 'لا', 'فقط إذا كانت x>0', 'لا توجد إجابة'], ans: 0, sol: 'R² مغلق تحت الجمع والضرب بعدد حقيقي، لذلك هو فضاء متجهات.' }
        ]
      },
      {
        title: 'التحويلات الخطية',
        desc: 'التحويل الخطي يحافظ على الجمع والضرب بالعدد. أمثلة عليه: التمدد، الدوران، الانعكاس، والإسقاط.',
        formula: 'T(u + v) = T(u) + T(v),  T(cu) = cT(u)',
        notes: 'أي تحويل فيه ثابت مضاف أو أس غير خطي لا يكون خطياً.',
        questions: [
          { q: 'أي تحويل من الآتي خطي؟', opts: ['T(x,y) = (2x, 3y)', 'T(x) = x + 1', 'T(x) = x²', 'T(x,y) = (xy, x)'], ans: 0, sol: 'التحويل (2x,3y) يحافظ على الجمع والضرب بعدد حقيقي، لذلك هو خطي.' },
          { q: 'هل T(x)=x+1 خطي؟', opts: ['نعم', 'لا', 'فقط إذا x>0', 'يعتمد على x'], ans: 1, sol: 'لأن T(u+v)=u+v+1 بينما T(u)+T(v)=u+v+2، وهذا لا يساوي، لذلك غير خطي.' },
          { q: 'أي تعبير يمثل التحويل الخطي بشكل عام؟', opts: ['ضرب مصفوفة في متجه', 'جمع ثابت', 'رفع المتجه للأس', 'تبديل إشارة فقط'], ans: 0, sol: 'كل تحويل خطي بين فضاءات منتهية الأبعاد يمكن تمثيله بضرب مصفوفة في المتجه.' },
          { q: 'T(0) في التحويل الخطي تساوي:', opts: ['1', '0', 'T(1)', 'غير معروف'], ans: 1, sol: 'لأن T(0)=T(0·u)=0·T(u)=0.' }
        ]
      }
    ];

    const state = JSON.parse(localStorage.getItem('la_course_state') || '{}');
    let activeIndex = 0;

    const app = document.getElementById('app');
    const topicsEl = document.getElementById('topics');
    const okCount = document.getElementById('okCount');
    const badCount = document.getElementById('badCount');
    const percentEl = document.getElementById('percent');
    const progressBar = document.getElementById('progressBar');

    function saveState() {
      localStorage.setItem('la_course_state', JSON.stringify(state));
      updateStats();
    }

    function updateStats() {
      const all = course.reduce((total, topic) => total + topic.questions.length, 0);
      const ok = Object.values(state).filter(v => v === 'ok').length;
      const bad = Object.values(state).filter(v => v === 'bad').length;
      const pct = all ? Math.round((ok / all) * 100) : 0;
      okCount.textContent = ok;
      badCount.textContent = bad;
      percentEl.textContent = pct + '%';
      progressBar.style.width = pct + '%';
    }

    function renderTopics() {
      topicsEl.innerHTML = course.map((topic, index) => {
        const isActive = index === activeIndex;
        const count = topic.questions.length;
        return `<button class="topic-btn ${isActive ? 'active' : ''}" data-index="${index}"><span>${index + 1}. ${topic.title}</span><small>${count} أسئلة</small></button>`;
      }).join('');

      document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeIndex = Number(btn.dataset.index);
          render();
        });
      });
    }

    function renderQuestion(q, qi, topicIndex) {
      const id = `${topicIndex}_${qi}`;
      const status = state[id];

      let correctClass = '';
      let wrongClass = '';
      let feedbackText = '';
      let solClass = status ? 'show' : '';
      let disabled = status ? 'disabled' : '';

      if (status === 'ok') {
        feedbackText = '✅ إجابة صحيحة — ممتاز!';
        correctClass = 'good';
      } else if (status === 'bad') {
        feedbackText = '❌ إجابة خاطئة — راجع الحل النموذجي أدناه.';
        wrongClass = 'bad';
      }

      const optionsHtml = q.opts.map((opt, idx) => {
        let extra = '';
        if (status === 'ok' && idx === q.ans) extra = 'correct';
        if (status === 'bad' && idx === Number(q.ans)) extra = 'correct';
        if (status === 'bad' && idx !== Number(q.ans) && window.__selectedIndex === idx && window.__selectedId === id) extra = 'wrong';
        return `<button class="option ${extra}" data-id="${id}" data-index="${idx}" ${disabled}>${opt}</button>`;
      }).join('');

      return `
        <article class="question" id="q-${id}">
          <small>تمرين ${qi + 1}</small>
          <h3>${q.q}</h3>
          <div class="options">${optionsHtml}</div>
          <div class="feedback ${correctClass || wrongClass}">${feedbackText}</div>
          <div class="solution ${solClass}"><b>الحل خطوة بخطوة:</b><br>${q.sol}</div>
        </article>
      `;
    }

    function render() {
      renderTopics();
      const topic = course[activeIndex];
      const filtered = topic.questions.filter(question => {
        const text = `${topic.title} ${question.q}`.toLowerCase();
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return !keyword || text.includes(keyword);
      });

      const html = `
        <div class="card topic-head">
          <h2>${activeIndex + 1}. ${topic.title}</h2>
          <div class="desc">${topic.desc}</div>
          <div class="formula">${topic.formula}</div>
          <div class="chapter-box"><strong>ملاحظة:</strong> ${topic.notes}</div>
        </div>
        ${filtered.length ? filtered.map((q, qi) => renderQuestion(q, qi, activeIndex)).join('') : '<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى أو اختر موضوعًا مختلفًا.</div>'}
      `;

      app.innerHTML = html;

      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const selectedIndex = Number(btn.dataset.index);
          const [tIndex, qIndex] = id.split('_').map(Number);
          const q = course[tIndex].questions[qIndex];
          const isCorrect = selectedIndex === q.ans;

          state[id] = isCorrect ? 'ok' : 'bad';
          saveState();
          window.__selectedIndex = selectedIndex;
          window.__selectedId = id;
          render();
          setTimeout(() => {
            const target = document.getElementById('q-' + id);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 50);
        });
      });

      updateStats();
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('randomBtn').addEventListener('click', () => {
      activeIndex = Math.floor(Math.random() * course.length);
      render();
      const questions = document.querySelectorAll('.question');
      if (questions.length) {
        questions[Math.floor(Math.random() * questions.length)].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('هل تريد تصفير كل نتائجك؟')) {
        Object.keys(state).forEach(key => delete state[key]);
        saveState();
        render();
      }
    });

    updateStats();
    render();
  </script>
</body>
</html>
