<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكاديمية الجبر الخطي التفاعلية</title><style>:root{--b:#08111f;--p:#14233a;--l:#395174;--a:#765cf6;--g:#22c55e;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1028,#102b46);color:#eef;font-family:Tahoma,Arial;line-height:1.8}.hero{text-align:center;padding:28px 15px}.hero h1{color:#c4b5fd;margin:0;font-size:clamp(25px,5vw,44px)}.hero p{color:#b9c8dc}.bar{position:sticky;top:0;z-index:3;background:#08111fee;backdrop-filter:blur(8px);padding:10px;display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--l)}.badge{background:var(--p);border:1px solid var(--l);padding:4px 13px;border-radius:20px}.badge b{color:#fde68a}.btn,input,select{border:1px solid var(--l);border-radius:8px;padding:9px 12px;font:inherit}.btn{background:var(--a);color:#fff;cursor:pointer}.btn.alt{background:#263d5d}main{max-width:1150px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:270px 1fr;gap:16px}.side,.card{background:#0e1a2dcc;border:1px solid var(--l);border-radius:14px}.side{padding:13px;height:max-content;position:sticky;top:64px}.side h2{font-size:17px}.topics{display:grid;gap:6px}.topic{background:transparent;color:#c9d5e7;text-align:right;border:1px solid transparent;border-radius:8px;padding:8px;cursor:pointer}.topic:hover,.topic.active{background:#29366b;color:#fff;border-color:var(--a)}.topic small{display:block;color:#8ea6c2}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select{background:var(--p);color:#fff;flex:1;min-width:180px}.head{padding:18px 20px}.head h2{margin:0;color:#ddd6fe}.head p{color:#c0cde0}.formula{background:#06101c;color:#9ee7ff;text-align:center;padding:8px;border-radius:8px;direction:ltr}.q{margin:13px;padding:15px;background:#192b45;border:1px solid #456184;border-radius:11px}.q h3{font-size:16px;margin:2px 0 10px}.opts{display:grid;gap:7px}.opt{background:#203653;color:#fff;border:1px solid #557392;border-radius:7px;padding:9px;text-align:right;cursor:pointer}.opt:hover:not(:disabled){border-color:#b2a8ff}.opt:disabled{cursor:default}.opt.correct{background:#075331;border-color:var(--g)}.opt.wrong{background:#641d28;border-color:var(--r)}.feedback{font-weight:bold;margin-top:8px}.good{color:#86efac}.bad{color:#fca5a5}.sol{display:none;background:#063b34;color:#d1fae5;border-right:4px solid var(--g);padding:10px;margin-top:10px;border-radius:7px}.sol.show{display:block}.empty{text-align:center;color:#b7c5d8;padding:45px}.progress{height:7px;width:180px;background:#263753;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),#26c6da)}footer{text-align:center;color:#9db0c8;padding:25px}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{position:static}.topics{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}</style></head><body><header class="hero"><h1>📐 أكاديمية الجبر الخطي</h1><p>شرح مبسط وتمارين كثيرة وتصحيح فوري وحلول خطوة بخطوة.</p></header><div class="bar"><span class="badge">✅ صحيح: <b id="ok">0</b></span><span class="badge">❌ خاطئ: <b id="no">0</b></span><span class="badge">📊 <b id="pct">0%</b></span><div class="progress"><i id="progress"></i></div><button class="btn alt" id="reset">تصفير</button></div><main><div class="layout"><aside class="side"><h2>موضوعات الجبر الخطي</h2><div class="topics" id="topics"></div></aside><section><div class="tools"><input id="search" placeholder="ابحث في أسئلة الموضوع..."><button class="btn" id="random">🎲 تمرين عشوائي</button></div><div id="app"></div></section></div><footer>حاول الإجابة أولاً، ثم راجع الحل التفصيلي وتعلم من الخطأ.</footer></main><script>
const topics=[
['المعادلات الخطية','رتب المعادلات ثم استخدم الحذف أو التعويض وتحقق من الحل.','x+y=5 , x-y=1',[['حل x+y=5 و x-y=1',['x=2,y=3','x=3,y=2','x=4,y=1','x=1,y=4'],1,'بالجمع: 2x=6، إذن x=3. بالتعويض: y=2.'],['إذا y=2x و x+y=9 فقيمة x؟',['2','3','4','9'],1,'x+2x=9 ثم 3x=9، لذلك x=3.'],['x+y=2 و x+y=5 لها:',['حل وحيد','حلول لا نهائية','لا حل','حلان'],2,'نحصل على 2=5، وهذا تناقض؛ إذن لا حل.'],['حل 2x=8 هو:',['2','4','6','8'],1,'نقسم الطرفين على 2: x=4.']]],
['العمليات على المصفوفات','الجمع عنصر بعنصر، والضرب صف في عمود، ويجب توافق الأبعاد.','A(m×n)B(n×p)=C(m×p)',[['[1 2;3 4]+[5 6;7 8]',['[6 8;10 12]','[5 12;21 32]','[4 4;4 4]','[6 8;10 11]'],0,'نجمع العناصر المتناظرة فنحصل على [6 8;10 12].'],['[1 2]×[3;4]',['7','10','11','24'],2,'1×3+2×4=3+8=11.'],['A من 2×3، عدد صفوف B لكي AB معرف؟',['2','3','4','لا يمكن'],1,'يجب أن تساوي صفوف B عدد أعمدة A، أي 3.'],['هل AB=BA دائماً؟',['نعم','لا','أحياناً فقط','نعم للمربعة'],1,'ضرب المصفوفات غير تبديلي عموماً.']]],
['أنواع المصفوفات','المربعة صفوفها تساوي أعمدتها، والقطرية خارج قطرها أصفار، والوحدة قطرها واحد.','Aᵀ تبديل الصفوف بالأعمدة',[['[1 0;0 1] هي:',['صفرية','وحدية','صفية','مستطيلة'],1,'القطر الرئيسي واحد والباقي صفر، فهي وحدية.'],['منقولة [1 2;3 4] هي:',['[1 3;2 4]','[4 3;2 1]','[1 2;3 4]','[2 1;4 3]'],0,'نحوّل الصفوف إلى أعمدة.'],['[2 0 0;5 3 0;1 4 7] هي:',['مثلثية عليا','مثلثية سفلى','قطرية','وحدية'],1,'العناصر فوق القطر أصفار، فهي مثلثية سفلى.'],['مصفوفة ذات عمود واحد تسمى:',['صفية','عمودية','مربعة دائماً','صفرية'],1,'لها عمود واحد ولذلك تسمى عمودية.']]],
['المحددات','للمصفوفة 2×2: det=ad−bc، وللمصفوفة المثلثية حاصل ضرب القطر.','det[[a,b],[c,d]]=ad−bc',[['det[[3,2],[1,4]]',['8','10','12','14'],1,'3×4−2×1=12−2=10.'],['det[[5,0],[0,3]]',['8','15','0','2'],1,'5×3=15.'],['محدد مثلثية قطرها 1,4,6',['11','24','120','0'],1,'1×4×6=24.'],['صفان متطابقان يجعل المحدد:',['1','−1','0','غير معرف'],2,'التطابق يؤدي إلى محدد يساوي صفرًا.']]],
['المعكوس والعمليات السطرية','المعكوس موجود إذا det لا يساوي صفرًا. في جاوس-جوردان نحول [A|I] إلى [I|A⁻¹].','[A|I] → [I|A⁻¹]',[['معكوس [[2,0],[0,2]]',['[[2,0],[0,2]]','[[1/2,0],[0,1/2]]','[[0,2],[2,0]]','لا يوجد'],1,'نقلب عناصر القطر: 1/2 و1/2.'],['لا يوجد المعكوس إذا:',['det=1','det=−1','det=0','��لمصفوفة مثلثية'],2,'لا يمكن القسمة على المحدد صفر.'],['R₂←R₂+3R₁ يغير المحدد؟',['نعم','لا','يضاعفه','يجعله صفرًا'],1,'إضافة مضاعف صف لا تغير المحدد.'],['تبديل صفين يجعل المحدد:',['نفسه','سالب قيمته','ضعفه','صفراً'],1,'التبديل يغير الإشارة فقط.']]],
['المتجهات والضرب القياسي','الضرب القياسي مجموع جداءات المركبات، والطول جذر مجموع مربعاتها.','u·v=Σuᵢvᵢ , ‖v‖=√Σvᵢ²',[['(1,2,3)·(4,5,6)',['21','28','32','41'],2,'4+10+18=32.'],['طول (3,4,0)',['3','4','5','7'],2,'√(9+16)=5.'],['u·v=0 يعني أنهما:',['متوازيان','متعامدان','متساويان','صفريان'],1,'التعامد يعني الضرب القياسي صفر.'],['إذا u·u=25 فطول u:',['25','10','5','0'],2,'‖u‖=√25=5.']]],
['المركبات والضرب الاتجاهي','المركبة الأفقية r cosθ والعمودية r sinθ. والضرب الاتجاهي يعطي متجهاً عمودياً في R³.','v=(r cosθ,r sinθ), ‖u×v‖=‖u‖‖v‖sinθ',[['r=10 وθ=30°، المركبة الأفقية',['5','5√3','10','10√3'],1,'10cos30=5√3.'],['للمتجه السابق، العمودية',['5','5√3','10','0'],0,'10sin30=5.'],['i×j',['i','j','k','−k'],2,'قاعدة الاتجاهات: i×j=k.'],['j×i',['k','−k','i','0'],1,'عكس الترتيب يغير الإشارة: −k.']]],
['المستقيمات والمستويات والمسافة','المستقيم r=r₀+tv. والمستوى يستخدم المتجه العمودي ومعادلة النقطة.','d=|ax₀+by₀+cz₀+d|/√(a²+b²+c²)',[['مستقيم يمر (1,2,3) واتجاهه (1,0,−1)',['r=(1,2,3)+t(1,0,−1)','r=(1,0,−1)+t(1,2,3)','x+y+z=1','لا يمكن'],0,'الصيغة نقطة + t في متجه الاتجاه.'],['عمودي 2x−y+3z=5',['(2,−1,3)','(2,1,3)','(5,0,0)','(1,2,3)'],0,'المعاملات هي مركبات العمودي.'],['المسافة بين (1,2,3),(4,6,3)',['4','5','6','25'],1,'√(3²+4²+0²)=5.'],['النقطة (2,3,1) عن x+2y+2z−10=0',['0','1','3','5'],0,'|2+6+2−10|=0.']]],
['الفضاءات والاستقلال الخطي','المجموعة مستقلة إذا كان الحل الوحيد للتركيبة الصفرية هو معاملات صفرية. فضاء المتجهات مغلق تحت الجمع والضرب القياسي.','c₁v₁+...+cₙvₙ=0',[['(1,0),(0,1)',['مرتبطان','مستقلان','متساويان','صفريان'],1,'هما أساس R² ومحدد الأعمدة 1.'],['(1,2),(2,4)',['مستقلان','مرتبطان','متعامدان','وحديان'],1,'الثاني ضعف الأول.'],['مجموعة فيها المتجه الصفري تكون:',['مستقلة','مرتبطة','متعامدة','غير معرفة'],1,'وجود الصفر يضمن ارتباط المجموعة.'],['R² فضاء متجهات؟',['نعم','لا','فقط إذا كان x موجباً','لا نعرف'],0,'R² مغلق تحت الجمع والضرب بعدد حقيقي.']]],
['التحويلات الخطية','التحويل الخطي يحفظ الجمع والضرب القياسي، ويمكن تمثيله غالباً بضرب مصفوفة في متجه.','T(u+v)=T(u)+T(v), T(cu)=cT(u)',[['أيها خطي؟',['T(x,y)=(2x,3y)','T(x)=x+1','T(x)=x²','T(x,y)=(xy,x)'],0,'المخرجات خطية ولا يوجد ثابت مضاف أو حاصل ضرب متغيرات.'],['T(x)=x+1 هو:',['خطي','غير خطي','متجهي صفري','مصفوفة وحدة'],1,'الثابت المضاف يخرق T(0)=0.'],['يمثل التحويل الخطي بواسطة:',['مصفوفة A وضرب Av','محدد فقط','عدد ثابت فقط','لا شيء'],0,'كل تحويل خطي بين فضاءات منتهية الأبعاد يمثله مصفوفة.'],['T(0) في التحويل الخطي يساوي:',['1','0','T(1)','غير معروف'],1,'من T(cu)=cT(u) أو حفظ الجمع ينتج T(0)=0.']]]];
let state=JSON.parse(localStorage.getItem('la_interactive')||'{}'),active=0;const $=x=>document.getElementById(x);function save(){localStorage.setItem('la_interactive',JSON.stringify(state));stats()}function stats(){let v=Object.values(state),a=v.filter(x=>x==='ok').length,b=v.filter(x=>x==='bad').length,n=topics.reduce((s,t)=>s+t[3].length,0),p=n?Math.round(a/n*100):0;$('ok').textContent=a;$('no').textContent=b;$('pct').textContent=p+'%';$('progress').style.width=p+'%'}function side(){ $('topics').innerHTML=topics.map((t,i)=>`<button class="topic ${i===active?'active':''}" data-i="${i}">${i+1}. ${t[0]}<small>${t[3].length} تمارين</small></button>`).join('');document.querySelectorAll('.topic').forEach(x=>x.onclick=()=>{active=+x.dataset.i;render()})}function render(){side();let t=topics[active],term=$('search').value.trim().toLowerCase(),qs=t[3].filter(q=>!term||(q[0]+' '+t[0]).toLowerCase().includes(term));let h=`<div class="card head"><h2>${active+1}. ${t[0]}</h2><p>${t[1]}</p><div class="formula">${t[2]}</div></div>`;if(!qs.length)h+='<div class="card empty">لا توجد نتائج مطابقة.</div>';qs.forEach((q,j)=>{let qi=t[3].indexOf(q),id=active+'_'+qi,done=state[id];h+=`<article class="q" id="q${id}"><small>تمرين ${j+1} من ${qs.length}</small><h3>${q[0]}</h3><div class="opts">${q[1].map((o,k)=>`<button class="opt ${done&&k===q[2]?'correct':''}" data-id="${id}" data-k="${k}" ${done?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback ${done==='ok'?'good':done==='bad'?'bad':''}">${done==='ok'?'✅ إجابة صحيحة!':done==='bad'?'❌ إجابة خاطئة؛ راجع الحل.':''}</div><div class="sol ${done?'show':''}"><b>الحل خطوة بخطوة:</b><br>${q[4]}</div></article>`});$('app').innerHTML=h;document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>answer(x));stats()}function answer(x){let id=x.dataset.id,k=+x.dataset.k,[ti,qi]=id.split('_').map(Number),q=topics[ti][3][qi],good=k===q[2];if(!good)x.classList.add('wrong');state[id]=good?'ok':'bad';save();render();setTimeout(()=>$(('q'+id)).scrollIntoView({behavior:'smooth',block:'center'}),0)}$('search').oninput=render;$('reset').onclick=()=>{if(confirm('تصفير كل النتائج؟')){state={};save();render()}};$('random').onclick=()=>{active=Math.floor(Math.random()*topics.length);render();let q=document.querySelectorAll('.q');if(q.length)q[Math.floor(Math.random()*q.length)].scrollIntoView({behavior:'smooth',block:'center'})};render();</script></body></html>
